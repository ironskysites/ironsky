<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Угадай Самолет</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            padding: 20px;
            position: relative;
            height: 100vh;
        }
        .quiz-container {
            background: rgba(255, 255, 255, 0.281);
            padding: 40px;
            margin-top: 10vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            display: inline-block;
            width: 600px;
            position: relative;
        }
        img {
            width: 100%;
            height: auto;
        }
        .options button, .options input[type="text"] {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            border: none;
            border-radius: 5px;
            background-color: rgba(227, 227, 227, 0.473);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .options button:hover {
            background-color: #474747;
        }
        .correct {
            background-color: #28a745 !important;
        }
        .incorrect {
            background-color: #dc3545 !important;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            text-align: right;
            font-size: 16px;
        }
        .flags {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 20px 0;
            justify-items: center;
        }

        .flag-option {
            position: relative;
            width: 5vw;
            height: auto;
            cursor: pointer;
        }
        .flag-option input {
            position: absolute;
            margin-top: 20%;
            margin-left: 80%;
            cursor: pointer;
            display: none;
        }
        .flag-option img {
            width: 100%;
            height: auto;
        }

        .mode-selectors, .question-selectors {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 4vh;
            margin-top: 4vh;
        }

        .mode-selectors select, .question-selectors select {
            padding: 10px;
            font-size: 16px;
            background-color: #585858b4;
            border-radius: 5px;
            color: white;
        }

        .start-btn {
            background-color: rgba(0, 0, 0, 0.425);
            color: rgb(255, 255, 255);
            font-size: 25px;
            border-radius: 7px;
            border: 1px solid rgba(128, 128, 128, 0);
            width: 50vw;
            height: 5vh;
            cursor: pointer;
            margin-top: 5vh;
        }

        .flag-option img.inactive {
            filter: grayscale(100%);
            opacity: 0.5;
            transition: filter 0.3s, opacity 0.3s;
        }


        

    </style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html">IronSky</a>
        <hr />
        <a href="aviaList.html">Авиация</a>
        <hr />
        <span 
            style="color: rgb(255, 255, 255); font-size: max(16px, calc(8px + 10 * (100vw / 1280)));; background: linear-gradient(rgba(255, 255, 255, 0) 85%, rgba(255, 0, 0, 0.705));
            background-color: rgba(0, 0, 0, 0); padding: 0.4vh 0.4vw;">
            Тесты
        </span>
        <hr />
        <a href="rules.html">Правила чата</a>
    </header>

    <div id="info-panel"></div>

    <div id="start-screen" style="padding-top: 10vh;">
        <h2>Выберите страны:</h2>
        <div class="flags">
            <label class="flag-option">
                <input type="checkbox" value="США" checked>
                <img src="images/usa.png" alt="США">
                <p>США</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Германия" checked>
                <img src="images/testImages/ger.png" alt="СССР">
                <p>Германия</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="СССР" checked>
                <img src="images/sssr.png" alt="СССР">
                <p>СССР</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Великобритания" checked>
                <img src="images/testImages/eng.png" alt="СССР">
                <p>Великобритания</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Япония" checked>
                <img src="images/testImages/jp.png" alt="СССР">
                <p>Япония</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Китай" checked>
                <img src="images/testImages/chi.png" alt="СССР">
                <p>Китай</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Италия" checked>
                <img src="images/testImages/it.png" alt="СССР">
                <p>Италия</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Франция" checked>
                <img src="images/testImages/fr.png" alt="СССР">
                <p>Франция</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Швеция" checked>
                <img src="images/testImages/sweden.png" alt="СССР">
                <p>Швеция</p>
            </label>
            <label class="flag-option">
                <input type="checkbox" value="Израиль" checked>
                <img src="images/testImages/isr.png" alt="СССР">
                <p>Израиль</p>
            </label>
            
            
            
        </div>

        <h2>Режимы</h2>
        <div class="mode-selectors">
            <select id="difficulty">
                <option value="easy">Угадать по вариантам</option>
                <option value="hard">Написать название</option>
            </select>
        </div>

        <h2>Количество вопросов</h2>
        <div class="question-selectors">
            <select id="question-count">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="hardcore">Хардкор</option>
            </select>
        </div>

        <button onclick="startQuiz()" class="start-btn">Начать тест</button>
    </div>

    <div class="quiz-container" id="quiz-container" style="display:none;">
        <img src="" alt="Фото самолета" id="plane-image">
        <div class="options" id="options"></div>
    </div>

    <script>
        const planes = [
            {name: "Ил-76", image: "images/testImages/il76.jpg", country: "СССР"},
            {name: "Боинг 747", image: "images/testImages/boeing747.jpg", country: "США"},
            {name: "Ту-160", image: "images/testImages/tu160.jpg", country: "СССР"},
            {name: "Су-27", image: "images/testImages/su27.jpg", country: "СССР"},
            {name: "МиГ-29", image: "images/testImages/mig29.jpg", country: "СССР"},
            {name: "А320", image: "images/testImages/a320.jpg", country: "Италия"},
            {name: "Як-40", image: "images/testImages/yak40.jpg", country: "СССР"},
            {name: "Ан-225", image: "images/testImages/an225.jpg", country: "СССР"},
            {name: "F-16", image: "images/testImages/f16.jpg", country: "США"},
            {name: "F-35", image: "images/testImages/f35.jpg", country: "США"},
            {name: "Kfir", image: "images/testImages/kfir.jpg", country: "Израиль"}
        ];

        let selectedPlanes = [];
        let remainingPlanes = [];
        let correctPlane = null;
        let score = 0;
        let startTime;
        let timerInterval;
        let difficulty = 'easy';
        let hardcoreMode = false;
        let questionLimit = 10;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function updateInfoPanel() {
            const elapsed = Math.floor((new Date() - startTime) / 1000);
            document.getElementById('info-panel').innerHTML = `
                <div style="margin-top: 10vh; font-size: 20px">
                    Время: ${elapsed} сек<br>
                    Осталось: ${remainingPlanes.length}
                </div>`;

        }

        function loadQuestion() {
            if (remainingPlanes.length === 0 || (!hardcoreMode && score >= questionLimit)) {
                endQuiz();
                return;
            }

            correctPlane = remainingPlanes.shift();

            document.getElementById('plane-image').src = correctPlane.image;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';



            if (difficulty === 'easy') {
                const options = shuffle([correctPlane, ...shuffle(selectedPlanes.filter(p => p.name !== correctPlane.name)).slice(0, 3)]);
                options.forEach(option => {
                    const button = document.createElement('button');
                    button.innerText = option.name;
                    button.onclick = () => checkAnswer(button, option.name);
                    optionsDiv.appendChild(button);
                });
            } else {
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'Введите название самолета';
                input.onkeydown = (e) => {
                    if (e.key === 'Enter') checkInputAnswer(input);
                };
                optionsDiv.appendChild(input);
                input.focus();
            }
        }

        function checkAnswer(button, selected) {
            if (selected === correctPlane.name) {
                button.classList.add('correct');
                score++;
                setTimeout(loadQuestion, 500);
            } else {
                button.classList.add('incorrect');
                if (hardcoreMode) {
                    endQuiz();
                } else {
                    setTimeout(loadQuestion, 500);
                }
            }
        }

        function checkInputAnswer(input) {
            const entered = input.value.trim();
            if (entered.toLowerCase() === correctPlane.name.toLowerCase()) {
                input.style.backgroundColor = '#28a745';
                score++;
                setTimeout(loadQuestion, 500);
            } else {
                input.style.backgroundColor = '#dc3545';
                if (hardcoreMode) {
                    endQuiz();
                } else {
                    setTimeout(loadQuestion, 500);
                }
            }
        }

        function endQuiz() {
            clearInterval(timerInterval);
            document.getElementById('info-panel').style.display = 'none'; // Скрыть панель информации
            const totalTime = Math.floor((new Date() - startTime) / 1000);
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = 
                `<div style="font-size: 20px;">
                    <h2 style="margin-top: 15px;">Тест завершён!</h2>
                    <p style="margin-top: 15px;">Ваш счёт: ${score}</p>
                    <p style="margin-top: 15px;">Время прохождения: ${totalTime} секунд</p>
                    <button onclick="restartQuiz()" style="font-size: 20px; margin-top: 25px; width: 20vw; height: 6vh; border-radius: 7px; cursor: pointer; border: 1px solid black; background-color: rgba(0, 0, 0, 0.425); color: white;">
                        Пройти снова
                    </button>
                </div>`;
        }


        function updateFlagVisuals() {
    document.querySelectorAll('.flag-option').forEach(label => {
        const checkbox = label.querySelector('input[type=checkbox]');
        const img = label.querySelector('img');
        if (!checkbox.checked) {
            img.classList.add('inactive');
        } else {
            img.classList.remove('inactive');
        }
    });
}

// Обработчики при изменении
document.querySelectorAll('.flag-option input[type=checkbox]').forEach(checkbox => {
    checkbox.addEventListener('change', updateFlagVisuals);
});

// Запуск при загрузке
updateFlagVisuals();

        
        function startQuiz() {
            const selectedCountries = Array.from(document.querySelectorAll('#start-screen input[type=checkbox]:checked')).map(input => input.value);
            if (selectedCountries.length < 2) {
                alert('Выберите минимум две страны.');
                return;
            }

            difficulty = document.getElementById('difficulty').value;
            const questionSetting = document.getElementById('question-count').value;
            hardcoreMode = (questionSetting === 'hardcore');
            questionLimit = hardcoreMode ? Infinity : parseInt(questionSetting);

            selectedPlanes = planes.filter(plane => selectedCountries.includes(plane.country));

            if (selectedPlanes.length < 4) {
                alert('Выберите больше стран или добавьте самолёты. Нужно минимум 4 самолета.');
                return;
            }

            remainingPlanes = shuffle([...selectedPlanes]);
            score = 0;
            startTime = new Date();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'inline-block';
            loadQuestion();
            timerInterval = setInterval(updateInfoPanel, 1000);
        }

        function restartQuiz() {
            document.location.reload();
        }
    </script>

</body>
</html>
